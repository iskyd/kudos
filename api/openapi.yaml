openapi: 3.0.3
info:
  title: KudOS API
  version: 0.1.0
  description: |
    REST API of KudOS. Errors use application/problem+json (RFC 9457) with a
    stable `type` per error kind. Every list endpoint is cursor-paginated:
    pass `nextCursor` from a page as `cursor` to get the next one; a missing
    `nextCursor` means the last page. Cursors are opaque.
  license:
    name: MIT
# Every operation needs a session unless it sets `security: []`. Authenticated
# requests other than GET/HEAD must also send the session's CSRF token in X-CSRF-Token.
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [system]
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            text/plain:
              schema:
                type: string
                example: ok
        default:
          $ref: "#/components/responses/Problem"
  /api/auth/register:
    post:
      operationId: register
      summary: Create an account and log in
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /api/auth/login:
    post:
      operationId: login
      summary: Log in
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /api/auth/logout:
    post:
      operationId: logout
      summary: Log out and end the session
      tags: [auth]
      responses:
        "204":
          description: Logged out; the session cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
        default:
          $ref: "#/components/responses/Problem"
  /api/config:
    get:
      operationId: getConfig
      summary: Frontend settings
      tags: [config]
      responses:
        "200":
          description: Settings from the server configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        default:
          $ref: "#/components/responses/Problem"
  /api/me:
    get:
      operationId: getMe
      summary: Current user and CSRF token
      tags: [auth]
      responses:
        "200":
          description: The logged-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      summary: Update profile settings
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities:
    get:
      operationId: listActivities
      summary: List activities
      description: |
        Newest first by default, or largest first by distance or duration (activities
        without the value last). Days are local calendar days, where the activity happened.
      tags: [activities]
      parameters:
        - name: sport
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ActivitySport"
        - name: from
          in: query
          required: false
          description: First local day, inclusive.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Last local day, inclusive.
          schema:
            type: string
            format: date
        - name: gear
          in: query
          required: false
          description: Only activities with this gear.
          schema:
            type: integer
            format: int64
        - name: tag
          in: query
          required: false
          description: Only activities with this pain tag.
          schema:
            type: string
            maxLength: 40
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [date, distance, duration]
            default: date
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createActivity
      summary: Create a manual activity
      description: Submitting the same sport and start time again updates that activity.
      tags: [activities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualActivityRequest"
      responses:
        "201":
          description: The activity was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedActivity"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/uploads:
    post:
      operationId: uploadActivity
      summary: Upload a FIT, GPX or TCX file
      description: |
        Stores the file's activities and keeps the original. Uploading the same
        activity again replaces it. The format comes from the file name's extension.
        Files over 64 MiB are rejected.
      tags: [activities]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: The file's activities were stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        default:
          $ref: "#/components/responses/Problem"
  /api/garmin:
    get:
      operationId: getGarminConnection
      summary: Garmin connection status
      description: The key and token are never returned, only the key's expiry and the sync state.
      tags: [garmin]
      responses:
        "200":
          description: The connection, or `connected` false when there is none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminConnection"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteGarminConnection
      summary: Disconnect Garmin
      description: Deletes the stored key and token. Synced activities and metrics are kept.
      tags: [garmin]
      responses:
        "204":
          description: Disconnected, or there was no connection.
        default:
          $ref: "#/components/responses/Problem"
  /api/garmin/key:
    put:
      operationId: setGarminKey
      summary: Set the Personal API key
      description: |
        Checks the key with Garmin by exchanging it for a token, then stores both
        encrypted. A key Garmin refuses is not stored (garmin-key-rejected).
      tags: [garmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGarminKeyRequest"
      responses:
        "200":
          description: The key was accepted and stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminConnection"
        default:
          $ref: "#/components/responses/Problem"
  /api/garmin/sync-interval:
    put:
      operationId: setGarminSyncInterval
      summary: Set how often Garmin is synced
      tags: [garmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGarminSyncIntervalRequest"
      responses:
        "200":
          description: The updated connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminConnection"
        default:
          $ref: "#/components/responses/Problem"
  /api/garmin/backfill:
    get:
      operationId: getGarminBackfill
      summary: Onboarding backfill progress
      tags: [garmin]
      responses:
        "200":
          description: The backfill, or `started` false when there is none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminBackfill"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: startGarminBackfill
      summary: Start the onboarding backfill
      description: |
        Imports the activities and daily health metrics of the last `days` local
        days, ending today. A user has one backfill (backfill-exists); a paused one
        is continued with resume.
      tags: [garmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartGarminBackfillRequest"
      responses:
        "202":
          description: The backfill was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminBackfill"
        default:
          $ref: "#/components/responses/Problem"
  /api/garmin/backfill/resume:
    post:
      operationId: resumeGarminBackfill
      summary: Resume the backfill
      description: Continues a paused backfill and, with retryFailed, imports the failed activities again.
      tags: [garmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeGarminBackfillRequest"
      responses:
        "200":
          description: The backfill after resuming.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminBackfill"
        default:
          $ref: "#/components/responses/Problem"
  /api/garmin/backfill/failures:
    get:
      operationId: listGarminBackfillFailures
      summary: Activities the backfill could not import
      tags: [garmin]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Failed activities, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminImportFailurePage"
        default:
          $ref: "#/components/responses/Problem"
  /api/garmin/sync:
    post:
      operationId: syncGarmin
      summary: Sync Garmin now
      description: |
        Queues a sync of the recent days unless one is already queued or running.
        Not available while the history import runs (backfill-running) or after
        Garmin rejected the key (garmin-key-rejected).
      tags: [garmin]
      responses:
        "202":
          description: A sync is queued or already running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncQueued"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}:
    get:
      operationId: getActivity
      summary: Activity detail
      description: The activity's summary, its recorded workout and, for a multisport activity, all its legs.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
      responses:
        "200":
          description: The activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}/annotation:
    put:
      operationId: setActivityAnnotation
      summary: Set what the user adds to an activity
      description: |
        Replaces RPE, feel (mood), notes, pain tags, weather and gear; a field left out or
        null is cleared. RPE and feel arrive pre-filled from the watch when it
        recorded them. Tags are trimmed, lowercased and deduplicated.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityAnnotation"
      responses:
        "200":
          description: The activity with its new annotation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}/edits:
    post:
      operationId: addActivityEdit
      summary: Edit an activity
      description: |
        Stores an edit as an override; samples are never changed. Trim, excluded heart
        rate, sport change, merge and split; each can be undone. Merging hides the other
        activity; splitting creates a second activity. Derived values are recomputed.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityEditRequest"
      responses:
        "200":
          description: The edited activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}/edits/{editId}:
    delete:
      operationId: undoActivityEdit
      summary: Undo one edit
      description: |
        Undoing a merge brings the merged activity back; undoing a split deletes the
        second part, with what was added to it.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
        - name: editId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The activity without that edit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/gear:
    get:
      operationId: listGear
      summary: List shoes and bikes
      description: Oldest first, each with the distance and time summed over its activities.
      tags: [gear]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of gear.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GearPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createGear
      summary: Add shoes or a bike
      tags: [gear]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GearInput"
      responses:
        "201":
          description: The new gear.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gear"
        default:
          $ref: "#/components/responses/Problem"
  /api/gear/{id}:
    put:
      operationId: updateGear
      summary: Edit, retire or reactivate gear
      tags: [gear]
      parameters:
        - $ref: "#/components/parameters/GearID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GearInput"
      responses:
        "200":
          description: The gear with its totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gear"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteGear
      summary: Delete gear
      description: Its activities are kept and lose their gear.
      tags: [gear]
      parameters:
        - $ref: "#/components/parameters/GearID"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}/laps:
    get:
      operationId: listLaps
      summary: Laps of an activity
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Laps in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LapPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}/lengths:
    get:
      operationId: listSwimLengths
      summary: Pool lengths of an activity
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lengths in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwimLengthPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}/sets:
    get:
      operationId: listStrengthSets
      summary: Strength sets of an activity
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Sets in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrengthSetPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}/streams:
    get:
      operationId: getActivityStreams
      summary: Sample streams of an activity
      description: |
        Columnar arrays sharing one time axis (seconds from the activity start); a
        channel the activity never recorded is absent, and gaps are null. Without
        maxPoints, full resolution comes in pages of up to 5000 samples. With
        maxPoints, each channel is reduced to at most that many points by LTTB for
        charts (the union of the points kept per channel, in one response); stored
        samples are never reduced.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
        - name: maxPoints
          in: query
          required: false
          schema:
            type: integer
            minimum: 3
            maximum: 10000
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The samples.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityStreams"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}/comparison:
    get:
      operationId: getActivityComparison
      summary: Two activities aligned for overlaying
      description: |
        Resamples this activity (a) and another (b) onto one evenly spaced axis,
        from 0 to the longer activity's end: seconds from each activity's first
        sample, or metres covered. Values are interpolated between neighbouring
        samples, never across a pause over 10 s; a value is null where an
        activity has none, and a channel neither point recorded is absent. Edits
        apply as on the streams.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
        - name: with
          in: query
          required: true
          description: The other activity.
          schema:
            type: integer
            format: int64
        - name: axis
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ComparisonAxis"
        - name: points
          in: query
          required: false
          schema:
            type: integer
            minimum: 2
            maximum: 5000
            default: 1000
      responses:
        "200":
          description: The aligned values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityComparison"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}/execution:
    get:
      operationId: getActivityExecution
      summary: How a structured workout was executed
      description: |
        For a workout run from the watch (steps), laps are grouped by workout step
        and each run is compared with its target; a step spanning several laps is
        one run, and planned steps nobody ran are listed as skipped. For a workout
        that sets a target power each second (Zwift, target_power), intervals are
        where the target changes and compliance is the time within 10 W of it.
        Kind none when the activity has neither.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
      responses:
        "200":
          description: The execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutExecution"
        default:
          $ref: "#/components/responses/Problem"
  /api/zones:
    get:
      operationId: listZoneSets
      summary: List zone versions
      description: |
        Latest effective date first, each with the zones its thresholds give
        (heart rate reserve only from its own max and resting HR).
      tags: [zones]
      parameters:
        - name: sport
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ZoneSport"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneSetPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createZoneSet
      summary: Add a zone version
      description: |
        Thresholds valid for a sport from effectiveFrom on; at most one version per
        sport and day. Running needs lthrBpm or thresholdSpeedMS, cycling ftpW or
        lthrBpm, swimming cssMS, general maxHrBpm and restingHrBpm.
      tags: [zones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneSetInput"
      responses:
        "201":
          description: The new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneSet"
        default:
          $ref: "#/components/responses/Problem"
  /api/zones/{zoneSetId}:
    delete:
      operationId: deleteZoneSet
      summary: Delete a zone version
      description: Activities on its dates fall back to the version before it.
      tags: [zones]
      parameters:
        - name: zoneSetId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}/zones:
    get:
      operationId: getActivityZones
      summary: The zones an activity uses
      description: |
        The versions valid on the activity's local date: its sport's and the
        general one (for heart rate reserve when the sport has no LTHR).
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
      responses:
        "200":
          description: The zones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityZones"
        default:
          $ref: "#/components/responses/Problem"
  /api/zones/suggestions:
    get:
      operationId: listZoneSuggestions
      summary: Pending zone suggestions
      description: |
        Thresholds recorded files carried that differ from the zone version valid
        on their date, latest first, each with that version (current) when there
        is one. Runs suggest running versions, rides cycling ones (a run's FTP is
        running power and never used), everything else general ones.
      tags: [zones]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of suggestions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneSuggestionPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/zones/suggestions/{suggestionId}/confirm:
    post:
      operationId: confirmZoneSuggestion
      summary: Confirm a zone suggestion
      description: |
        Creates a version from the suggestion's date: the version valid then, with
        the suggested values over it. The suggestion goes.
      tags: [zones]
      parameters:
        - $ref: "#/components/parameters/SuggestionID"
      responses:
        "201":
          description: The new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneSet"
        default:
          $ref: "#/components/responses/Problem"
  /api/zones/suggestions/{suggestionId}/dismiss:
    post:
      operationId: dismissZoneSuggestion
      summary: Dismiss a zone suggestion
      description: The same values from later files are not suggested again.
      tags: [zones]
      parameters:
        - $ref: "#/components/parameters/SuggestionID"
      responses:
        "204":
          description: Dismissed.
        default:
          $ref: "#/components/responses/Problem"
  /api/fitness:
    get:
      operationId: getFitness
      summary: Fitness, fatigue and form by day
      description: |
        Daily training load summed over activities by local date, with fitness
        (CTL, 42-day), fatigue (ATL, 7-day) and form (TSB, the previous day's
        fitness minus fatigue), computed on demand. The recurrences start from
        zero a year before from, so earlier history weighs under 0.02%. At most
        3660 days per request.
      tags: [analytics]
      parameters:
        - name: from
          in: query
          required: true
          description: First local day, inclusive.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Last local day, inclusive.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: One entry per day from from to to.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FitnessDay"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kudos_session
  headers:
    SetSessionCookie:
      description: The HttpOnly session cookie.
      schema:
        type: string
  parameters:
    ActivityID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SuggestionID:
      name: suggestionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    GearID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `nextCursor`.
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  schemas:
    Username:
      type: string
      description: 3 to 32 characters among a-z, 0-9, ".", "_" and "-". Case-insensitive; stored lowercase.
      minLength: 3
      maxLength: 32
      pattern: "^[A-Za-z0-9._-]+$"
    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 256
    Timezone:
      type: string
      description: IANA time zone name.
      example: Europe/Rome
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        timezone:
          $ref: "#/components/schemas/Timezone"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    UpdateMeRequest:
      type: object
      required: [timezone]
      properties:
        timezone:
          $ref: "#/components/schemas/Timezone"
    Me:
      type: object
      required: [id, username, timezone, csrfToken]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        timezone:
          $ref: "#/components/schemas/Timezone"
        csrfToken:
          type: string
          description: Send as X-CSRF-Token on every authenticated request other than GET or HEAD.
    Sport:
      type: string
      enum: [running, trail_running, cycling, pool_swimming, open_water_swimming, hiking, strength, other]
    ActivitySport:
      type: string
      description: A stored activity's sport; transition is a multisport leg between disciplines.
      enum: [running, trail_running, cycling, pool_swimming, open_water_swimming, hiking, strength, transition, other]
    ActivitySummary:
      type: object
      required: [id, sport, subtype, source, startTime, utcOffsetS]
      properties:
        id:
          type: integer
          format: int64
        sport:
          $ref: "#/components/schemas/ActivitySport"
        subtype:
          type: string
          enum: [outdoor, indoor, virtual, treadmill]
        source:
          type: string
          enum: [garmin, upload, manual, split]
          description: "`split` is the second part of a split activity."
        startTime:
          type: string
          format: date-time
          description: Start in UTC.
        utcOffsetS:
          type: integer
          description: Local offset where the activity happened, in seconds.
        elapsedTimeS:
          type: number
          format: double
        timerTimeS:
          type: number
          format: double
        distanceM:
          type: number
          format: double
        ascentM:
          type: number
          format: float
        avgSpeedMS:
          type: number
          format: float
        avgHrBpm:
          type: integer
        avgPowerW:
          type: integer
        rpe:
          type: number
          format: float
    ActivityPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ActivitySummary"
    ManualActivityRequest:
      type: object
      required: [sport, localStartTime, durationS]
      properties:
        sport:
          $ref: "#/components/schemas/Sport"
        localStartTime:
          type: string
          description: Start in the user's timezone, as YYYY-MM-DDTHH:MM.
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$"
          example: 2026-10-29T07:30
        durationS:
          type: number
          format: double
          description: Duration in seconds, up to 7 days.
          exclusiveMinimum: true
          minimum: 0
          maximum: 604800
        distanceM:
          type: number
          format: double
          description: Distance in metres.
          minimum: 0
          maximum: 10000000
        rpe:
          type: number
          format: double
          description: Rating of perceived exertion, 0 to 10.
          minimum: 0
          maximum: 10
        notes:
          type: string
          maxLength: 2000
    CreatedActivity:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
    UploadResult:
      type: object
      required: [activityIds]
      properties:
        activityIds:
          type: array
          description: The stored activities; several for a multisport file.
          items:
            type: integer
            format: int64
    GarminConnection:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean
        status:
          type: string
          enum: [connected, key_rejected]
          description: key_rejected when Garmin refused the key; sync is paused until a new key is set.
        keyExpiresOn:
          type: string
          format: date
          description: The key's expiry date as entered by the user.
        syncIntervalHours:
          type: integer
          minimum: 1
          maximum: 24
        lastSyncAt:
          type: string
          format: date-time
        syncedThrough:
          type: string
          format: date
          description: The last local day fully synced.
        lastError:
          type: string
          description: Why the last sync failed; absent once a sync succeeds.
    SetGarminKeyRequest:
      type: object
      required: [key, expiresOn]
      properties:
        key:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        expiresOn:
          type: string
          format: date
          description: The expiry Garmin showed when the key was created, at most a year ahead.
    SetGarminSyncIntervalRequest:
      type: object
      required: [hours]
      properties:
        hours:
          type: integer
          minimum: 1
          maximum: 24
    SyncQueued:
      type: object
      required: [queued]
      properties:
        queued:
          type: boolean
          description: False when a sync was already queued or running.
    StartGarminBackfillRequest:
      type: object
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 365
          default: 120
          description: How many days of history to import, ending today.
    ResumeGarminBackfillRequest:
      type: object
      properties:
        retryFailed:
          type: boolean
          default: false
    GarminBackfill:
      type: object
      required: [started]
      properties:
        started:
          type: boolean
        status:
          type: string
          enum: [running, paused, done]
        pauseReason:
          type: string
          enum: [rate_limited, key_rejected, disconnected]
          description: Set while paused. A rate-limited backfill continues by itself.
        windowStart:
          type: string
          format: date
        windowEnd:
          type: string
          format: date
        activitiesTotal:
          type: integer
          description: Activities found in the window; 0 until they are listed.
        activitiesDone:
          type: integer
        activitiesFailed:
          type: integer
        daysTotal:
          type: integer
        daysDone:
          type: integer
          description: Days whose health metrics are stored.
    GarminImportFailure:
      type: object
      required: [sourceActivityId, startTime, reason]
      properties:
        sourceActivityId:
          type: string
        startTime:
          type: string
          format: date-time
        reason:
          type: string
    GarminImportFailurePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/GarminImportFailure"
    ActivityDetail:
      allOf:
        - $ref: "#/components/schemas/ActivitySummary"
        - type: object
          required: [legs, painTags, edits]
          properties:
            descentM:
              type: number
              format: float
            maxSpeedMS:
              type: number
              format: float
            maxHrBpm:
              type: integer
            maxPowerW:
              type: integer
            avgCadence:
              type: number
              format: float
            maxCadence:
              type: number
              format: float
            avgTemperatureC:
              type: number
              format: float
            poolLengthM:
              type: number
              format: float
            caloriesKcal:
              type: integer
            feel:
              type: integer
              description: Workout feel, 0 to 100.
            notes:
              type: string
            weatherTemperatureC:
              type: number
              format: float
            weatherCondition:
              type: string
              enum: [sun, cloud, rain, wind, snow]
            workout:
              $ref: "#/components/schemas/RecordedWorkout"
            painTags:
              type: array
              items:
                type: string
            gearId:
              type: integer
              format: int64
            edits:
              type: array
              description: The user's edits, oldest first; values above already apply them.
              items:
                $ref: "#/components/schemas/ActivityEdit"
            mergedInto:
              type: integer
              format: int64
              description: The activity this one was merged into; it is left out of the list.
            splitOf:
              type: integer
              format: int64
              description: For the second part of a split, the activity it was split from.
            legs:
              type: array
              description: Every leg of the multisport activity this one belongs to, in order; empty otherwise.
              items:
                $ref: "#/components/schemas/ActivitySummary"

    ActivityAnnotation:
      type: object
      properties:
        rpe:
          type: number
          format: float
          minimum: 0
          maximum: 10
          description: Rating of perceived exertion.
        feel:
          type: integer
          minimum: 0
          maximum: 100
          description: Mood after the activity, 0 (very weak) to 100 (very strong), as Garmin records it.
        notes:
          type: string
          maxLength: 2000
        painTags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 40
        weatherTemperatureC:
          type: number
          format: float
          minimum: -60
          maximum: 60
        weatherCondition:
          type: string
          enum: [sun, cloud, rain, wind, snow]
        gearId:
          type: integer
          format: int64
          description: The user's own shoes or bike.
    ActivityEditKind:
      type: string
      enum: [sport, trim, exclude_hr, merge, split]
    ActivityEdit:
      type: object
      required: [id, kind, createdAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/ActivityEditKind"
        createdAt:
          type: string
          format: date-time
        sport:
          $ref: "#/components/schemas/ActivitySport"
        subtype:
          type: string
          enum: [outdoor, indoor, virtual, treadmill]
        from:
          type: string
          format: date-time
          description: Trim or excluded heart rate range start, inclusive.
        to:
          type: string
          format: date-time
          description: Range end, inclusive.
        at:
          type: string
          format: date-time
          description: Where a split's second part starts.
        activityId:
          type: integer
          format: int64
          description: The activity merged in, or the second part of a split.
    ActivityEditRequest:
      type: object
      required: [kind]
      description: |
        Offsets are seconds from the activity's current start. sport: sport and
        subtype; trim and exclude_hr: fromS and toS (inclusive); split: atS, where
        the second part starts; merge: activityId, the activity to merge in.
      properties:
        kind:
          $ref: "#/components/schemas/ActivityEditKind"
        sport:
          $ref: "#/components/schemas/ActivitySport"
        subtype:
          type: string
          enum: [outdoor, indoor, virtual, treadmill]
        fromS:
          type: number
          format: double
          minimum: 0
        toS:
          type: number
          format: double
          minimum: 0
        atS:
          type: number
          format: double
          minimum: 0
        activityId:
          type: integer
          format: int64
    GearInput:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [shoes, bike]
        name:
          type: string
          minLength: 1
          maxLength: 80
        replacementDistanceM:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Distance at which to replace it; absent for no warning.
        retired:
          type: boolean
          default: false
    Gear:
      allOf:
        - $ref: "#/components/schemas/GearInput"
        - type: object
          required: [id, retired, distanceM, timeS, activities, replacementDue]
          properties:
            id:
              type: integer
              format: int64
            distanceM:
              type: number
              format: double
              description: Summed over the assigned activities.
            timeS:
              type: number
              format: double
              description: Timer time (else elapsed time) summed over the assigned activities.
            activities:
              type: integer
              format: int64
            replacementDue:
              type: boolean
              description: The distance has reached the replacement threshold.
    GearPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Gear"
    RecordedWorkout:
      type: object
      required: [steps]
      properties:
        name:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutStep"
    WorkoutStep:
      type: object
      required: [index, durationType]
      description: Values in SI units; duration is s for time, m for distance, a count for reps.
      properties:
        index:
          type: integer
        name:
          type: string
        intensity:
          type: string
        durationType:
          type: string
        duration:
          type: number
          format: double
        targetType:
          type: string
        targetLow:
          type: number
          format: double
        targetHigh:
          type: number
          format: double
        targetZone:
          type: integer
        repeatFrom:
          type: integer
        repeatCount:
          type: integer
        exerciseCategory:
          type: integer
        exerciseNumber:
          type: integer
        weightKg:
          type: number
          format: double
    Lap:
      type: object
      required: [index, startTime]
      properties:
        index:
          type: integer
        startTime:
          type: string
          format: date-time
        elapsedTimeS:
          type: number
          format: double
        timerTimeS:
          type: number
          format: double
        distanceM:
          type: number
          format: double
        ascentM:
          type: number
          format: float
        descentM:
          type: number
          format: float
        avgSpeedMS:
          type: number
          format: float
        maxSpeedMS:
          type: number
          format: float
        avgHrBpm:
          type: integer
        maxHrBpm:
          type: integer
        avgPowerW:
          type: integer
        maxPowerW:
          type: integer
        avgCadence:
          type: number
          format: float
        intensity:
          type: string
          enum: [active, rest, warmup, cooldown, recovery, interval, other]
        workoutStepIndex:
          type: integer
    SwimLength:
      type: object
      required: [index, startTime, active]
      properties:
        index:
          type: integer
        startTime:
          type: string
          format: date-time
        elapsedTimeS:
          type: number
          format: double
        timerTimeS:
          type: number
          format: double
        active:
          type: boolean
          description: False for rest (idle) lengths.
        stroke:
          type: string
          enum: [freestyle, backstroke, breaststroke, butterfly, drill, mixed, im]
        strokes:
          type: integer
        avgSpeedMS:
          type: number
          format: float
        swolf:
          type: number
          format: double
          description: Length time in seconds plus strokes, computed by KudOS.
    StrengthSet:
      type: object
      required: [index, startTime, active]
      properties:
        index:
          type: integer
        startTime:
          type: string
          format: date-time
        durationS:
          type: number
          format: double
        active:
          type: boolean
          description: False for rest sets.
        reps:
          type: integer
        weightKg:
          type: number
          format: float
        exerciseName:
          type: string
        exerciseCategory:
          type: integer
        exerciseNumber:
          type: integer
        workoutStepIndex:
          type: integer
    LapPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Lap"
    SwimLengthPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SwimLength"
    StrengthSetPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/StrengthSet"
    ComparisonAxis:
      type: string
      enum: [time, distance]
      default: time
    ActivityComparison:
      type: object
      required: [axis, x, a, b]
      properties:
        axis:
          $ref: "#/components/schemas/ComparisonAxis"
        x:
          type: array
          description: The common axis, in seconds or metres from the start.
          items:
            type: number
            format: double
        a:
          $ref: "#/components/schemas/ComparedStreams"
        b:
          $ref: "#/components/schemas/ComparedStreams"
    ComparedStreams:
      type: object
      description: One activity's values at each point of x.
      properties:
        elapsedS:
          type: array
          description: Seconds from the activity's first sample.
          items: {type: number, format: double, nullable: true}
        distanceM:
          type: array
          description: Metres covered.
          items: {type: number, format: double, nullable: true}
        hrBpm:
          type: array
          items: {type: number, format: double, nullable: true}
        powerW:
          type: array
          items: {type: number, format: double, nullable: true}
        cadence:
          type: array
          items: {type: number, format: double, nullable: true}
        speedMS:
          type: array
          items: {type: number, format: double, nullable: true}
        altitudeM:
          type: array
          items: {type: number, format: double, nullable: true}
    WorkoutExecution:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [none, steps, target_power]
        steps:
          type: array
          description: Runs of the workout's steps in order (kind steps).
          items:
            $ref: "#/components/schemas/StepExecution"
        intervals:
          type: array
          description: Stretches of one target power (kind target_power), at most 1000.
          items:
            $ref: "#/components/schemas/PowerInterval"
        withinS:
          type: number
          format: double
          description: Seconds within toleranceW of the target, over the whole workout.
        totalS:
          type: number
          format: double
          description: Seconds of the workout with recorded power.
        toleranceW:
          type: number
          format: double
    StepExecution:
      type: object
      required: [stepIndex, laps]
      properties:
        stepIndex:
          type: integer
          description: Index into the recorded workout's steps.
        laps:
          type: integer
          description: Laps that ran the step; 0 when it was skipped.
        timerTimeS:
          type: number
          format: double
        distanceM:
          type: number
          format: double
        avgSpeedMS:
          type: number
          format: double
        avgHrBpm:
          type: number
          format: double
        avgPowerW:
          type: number
          format: double
        avgCadence:
          type: number
          format: double
        actual:
          type: number
          format: double
          description: The value compared with the step's target, in its unit (m/s, bpm or W).
        result:
          type: string
          enum: [below, within, above, skipped]
          description: Absent when the step has no target that can be compared.
    PowerInterval:
      type: object
      required: [startS, durationS, targetW, withinS]
      properties:
        startS:
          type: number
          format: double
          description: Seconds from the activity start.
        durationS:
          type: number
          format: double
        targetW:
          type: number
          format: double
        avgPowerW:
          type: number
          format: double
        withinS:
          type: number
          format: double
    ZoneSport:
      type: string
      description: Sports that share thresholds; general holds max and resting HR for any sport.
      enum: [running, cycling, swimming, general]
    ZoneSetInput:
      type: object
      required: [sport, effectiveFrom]
      properties:
        sport:
          $ref: "#/components/schemas/ZoneSport"
        effectiveFrom:
          type: string
          format: date
        lthrBpm:
          type: integer
          minimum: 60
          maximum: 240
          description: Lactate threshold heart rate.
        thresholdSpeedMS:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Running threshold pace, as a speed.
        ftpW:
          type: integer
          minimum: 1
          maximum: 2000
          description: Cycling functional threshold power.
        cssMS:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Critical swim speed.
        maxHrBpm:
          type: integer
          minimum: 60
          maximum: 250
        restingHrBpm:
          type: integer
          minimum: 20
          maximum: 150
    ZoneSet:
      allOf:
        - $ref: "#/components/schemas/ZoneSetInput"
        - type: object
          required: [id, zones]
          properties:
            id:
              type: integer
              format: int64
            zones:
              $ref: "#/components/schemas/Zones"
    ZoneSetPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ZoneSet"
    Zones:
      type: object
      description: |
        Zones per metric with the model each comes from: friel_run_hr,
        friel_bike_hr or heart_rate_reserve (bpm); friel_run_pace or css (m/s,
        slow to fast); coggan_power (W). A metric without a model is absent.
      properties:
        hrModel:
          type: string
        hr:
          type: array
          items:
            $ref: "#/components/schemas/Zone"
        paceModel:
          type: string
        pace:
          type: array
          items:
            $ref: "#/components/schemas/Zone"
        powerModel:
          type: string
        power:
          type: array
          items:
            $ref: "#/components/schemas/Zone"
    Zone:
      type: object
      required: [name]
      description: The range [low, high); low is absent for the first zone and high for the last.
      properties:
        name:
          type: string
        low:
          type: number
          format: double
        high:
          type: number
          format: double
    ActivityZones:
      type: object
      required: [sport, day, zones]
      properties:
        sport:
          $ref: "#/components/schemas/ZoneSport"
        day:
          type: string
          format: date
          description: The activity's local date.
        zoneSetId:
          type: integer
          format: int64
          description: The sport's version used, if any.
        generalZoneSetId:
          type: integer
          format: int64
          description: The general version used for heart rate reserve, if any.
        zones:
          $ref: "#/components/schemas/Zones"
    ZoneSuggestion:
      type: object
      required: [id, sport, effectiveFrom]
      properties:
        id:
          type: integer
          format: int64
        sport:
          $ref: "#/components/schemas/ZoneSport"
        effectiveFrom:
          type: string
          format: date
          description: The local date of the first file that carried these values.
        lthrBpm:
          type: integer
        ftpW:
          type: integer
        maxHrBpm:
          type: integer
        restingHrBpm:
          type: integer
        activityId:
          type: integer
          format: int64
          description: The activity whose file carried them.
        current:
          $ref: "#/components/schemas/ZoneSet"
    ZoneSuggestionPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ZoneSuggestion"
    FitnessDay:
      type: object
      required: [day, load, ctl, atl, tsb]
      properties:
        day:
          type: string
          format: date
        load:
          type: number
          format: double
          description: The day's summed training load.
        ctl:
          type: number
          format: double
          description: Fitness.
        atl:
          type: number
          format: double
          description: Fatigue.
        tsb:
          type: number
          format: double
          description: Form.
    ActivityStreams:
      type: object
      required: [timeS]
      properties:
        timeS:
          type: array
          description: Seconds from the activity start.
          items:
            type: number
            format: double
        lat:
          type: array
          description: Degrees.
          items:
            type: number
            format: double
            nullable: true
        lon:
          type: array
          description: Degrees.
          items:
            type: number
            format: double
            nullable: true
        altitudeM:
          type: array
          description: Metres.
          items:
            type: number
            format: double
            nullable: true
        hrBpm:
          type: array
          description: Beats per minute.
          items:
            type: number
            format: double
            nullable: true
        powerW:
          type: array
          description: Watts.
          items:
            type: number
            format: double
            nullable: true
        cadence:
          type: array
          description: Steps per minute for running and hiking, rpm for cycling.
          items:
            type: number
            format: double
            nullable: true
        speedMS:
          type: array
          description: Metres per second.
          items:
            type: number
            format: double
            nullable: true
        distanceM:
          type: array
          description: Metres from the start.
          items:
            type: number
            format: double
            nullable: true
        temperatureC:
          type: array
          description: Degrees Celsius.
          items:
            type: number
            format: double
            nullable: true
        nextCursor:
          type: string
          description: Cursor for the next page of full-resolution samples; absent on the last page.
    Config:
      type: object
      required: [mapTileUrl]
      properties:
        mapTileUrl:
          type: string
          description: Raster tile URL template with {z}, {x} and {y}.
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Stable URI identifying the error kind, e.g. urn:kudos:problem:not-found.
        title:
          type: string
          description: Short summary of the error kind.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation of this occurrence.
        requestId:
          type: string
          description: ID of the request, also sent as the X-Request-Id header.
    Page:
      type: object
      description: Pagination envelope. List responses add an `items` array with allOf.
      properties:
        nextCursor:
          type: string
          description: Cursor for the next page; absent on the last page.
  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
