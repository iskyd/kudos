openapi: 3.0.3
info:
  title: KudOS API
  version: 0.1.0
  description: |
    REST API of KudOS. Errors use application/problem+json (RFC 9457) with a
    stable `type` per error kind. Every list endpoint is cursor-paginated:
    pass `nextCursor` from a page as `cursor` to get the next one; a missing
    `nextCursor` means the last page. Cursors are opaque.
  license:
    name: MIT
# Every operation needs a session unless it sets `security: []`. Authenticated
# requests other than GET/HEAD must also send the session's CSRF token in X-CSRF-Token.
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [system]
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            text/plain:
              schema:
                type: string
                example: ok
        default:
          $ref: "#/components/responses/Problem"
  /api/auth/register:
    post:
      operationId: register
      summary: Create an account and log in
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /api/auth/login:
    post:
      operationId: login
      summary: Log in
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /api/auth/logout:
    post:
      operationId: logout
      summary: Log out and end the session
      tags: [auth]
      responses:
        "204":
          description: Logged out; the session cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
        default:
          $ref: "#/components/responses/Problem"
  /api/me:
    get:
      operationId: getMe
      summary: Current user and CSRF token
      tags: [auth]
      responses:
        "200":
          description: The logged-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      summary: Update profile settings
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities:
    get:
      operationId: listActivities
      summary: List activities
      description: |
        Newest first by default, or largest first by distance or duration (activities
        without the value last). Days are local calendar days, where the activity happened.
      tags: [activities]
      parameters:
        - name: sport
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ActivitySport"
        - name: from
          in: query
          required: false
          description: First local day, inclusive.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Last local day, inclusive.
          schema:
            type: string
            format: date
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [date, distance, duration]
            default: date
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createActivity
      summary: Create a manual activity
      description: Submitting the same sport and start time again updates that activity.
      tags: [activities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualActivityRequest"
      responses:
        "201":
          description: The activity was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedActivity"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/uploads:
    post:
      operationId: uploadActivity
      summary: Upload a FIT, GPX or TCX file
      description: |
        Stores the file's activities and keeps the original. Uploading the same
        activity again replaces it. The format comes from the file name's extension.
        Files over 64 MiB are rejected.
      tags: [activities]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: The file's activities were stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        default:
          $ref: "#/components/responses/Problem"
  /api/garmin:
    get:
      operationId: getGarminConnection
      summary: Garmin connection status
      description: The key and token are never returned, only the key's expiry and the sync state.
      tags: [garmin]
      responses:
        "200":
          description: The connection, or `connected` false when there is none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminConnection"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteGarminConnection
      summary: Disconnect Garmin
      description: Deletes the stored key and token. Synced activities and metrics are kept.
      tags: [garmin]
      responses:
        "204":
          description: Disconnected, or there was no connection.
        default:
          $ref: "#/components/responses/Problem"
  /api/garmin/key:
    put:
      operationId: setGarminKey
      summary: Set the Personal API key
      description: |
        Checks the key with Garmin by exchanging it for a token, then stores both
        encrypted. A key Garmin refuses is not stored (garmin-key-rejected).
      tags: [garmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGarminKeyRequest"
      responses:
        "200":
          description: The key was accepted and stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminConnection"
        default:
          $ref: "#/components/responses/Problem"
  /api/garmin/sync-interval:
    put:
      operationId: setGarminSyncInterval
      summary: Set how often Garmin is synced
      tags: [garmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGarminSyncIntervalRequest"
      responses:
        "200":
          description: The updated connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminConnection"
        default:
          $ref: "#/components/responses/Problem"
  /api/garmin/backfill:
    get:
      operationId: getGarminBackfill
      summary: Onboarding backfill progress
      tags: [garmin]
      responses:
        "200":
          description: The backfill, or `started` false when there is none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminBackfill"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: startGarminBackfill
      summary: Start the onboarding backfill
      description: |
        Imports the activities and daily health metrics of the last `days` local
        days, ending today. A user has one backfill (backfill-exists); a paused one
        is continued with resume.
      tags: [garmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartGarminBackfillRequest"
      responses:
        "202":
          description: The backfill was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminBackfill"
        default:
          $ref: "#/components/responses/Problem"
  /api/garmin/backfill/resume:
    post:
      operationId: resumeGarminBackfill
      summary: Resume the backfill
      description: Continues a paused backfill and, with retryFailed, imports the failed activities again.
      tags: [garmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeGarminBackfillRequest"
      responses:
        "200":
          description: The backfill after resuming.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminBackfill"
        default:
          $ref: "#/components/responses/Problem"
  /api/garmin/backfill/failures:
    get:
      operationId: listGarminBackfillFailures
      summary: Activities the backfill could not import
      tags: [garmin]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Failed activities, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminImportFailurePage"
        default:
          $ref: "#/components/responses/Problem"
  /api/garmin/sync:
    post:
      operationId: syncGarmin
      summary: Sync Garmin now
      description: |
        Queues a sync of the recent days unless one is already queued or running.
        Not available while the history import runs (backfill-running) or after
        Garmin rejected the key (garmin-key-rejected).
      tags: [garmin]
      responses:
        "202":
          description: A sync is queued or already running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncQueued"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}:
    get:
      operationId: getActivity
      summary: Activity detail
      description: The activity's summary, its recorded workout and, for a multisport activity, all its legs.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
      responses:
        "200":
          description: The activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}/laps:
    get:
      operationId: listLaps
      summary: Laps of an activity
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Laps in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LapPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}/lengths:
    get:
      operationId: listSwimLengths
      summary: Pool lengths of an activity
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lengths in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwimLengthPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}/sets:
    get:
      operationId: listStrengthSets
      summary: Strength sets of an activity
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Sets in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrengthSetPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/activities/{id}/streams:
    get:
      operationId: getActivityStreams
      summary: Sample streams of an activity
      description: |
        Columnar arrays sharing one time axis (seconds from the activity start); a
        channel the activity never recorded is absent, and gaps are null. Without
        maxPoints, full resolution comes in pages of up to 5000 samples. With
        maxPoints, each channel is reduced to at most that many points by LTTB for
        charts (the union of the points kept per channel, in one response); stored
        samples are never reduced.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/ActivityID"
        - name: maxPoints
          in: query
          required: false
          schema:
            type: integer
            minimum: 3
            maximum: 10000
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The samples.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityStreams"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kudos_session
  headers:
    SetSessionCookie:
      description: The HttpOnly session cookie.
      schema:
        type: string
  parameters:
    ActivityID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `nextCursor`.
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  schemas:
    Username:
      type: string
      description: 3 to 32 characters among a-z, 0-9, ".", "_" and "-". Case-insensitive; stored lowercase.
      minLength: 3
      maxLength: 32
      pattern: "^[A-Za-z0-9._-]+$"
    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 256
    Timezone:
      type: string
      description: IANA time zone name.
      example: Europe/Rome
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        timezone:
          $ref: "#/components/schemas/Timezone"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    UpdateMeRequest:
      type: object
      required: [timezone]
      properties:
        timezone:
          $ref: "#/components/schemas/Timezone"
    Me:
      type: object
      required: [id, username, timezone, csrfToken]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        timezone:
          $ref: "#/components/schemas/Timezone"
        csrfToken:
          type: string
          description: Send as X-CSRF-Token on every authenticated request other than GET or HEAD.
    Sport:
      type: string
      enum: [running, trail_running, cycling, pool_swimming, open_water_swimming, hiking, strength, other]
    ActivitySport:
      type: string
      description: A stored activity's sport; transition is a multisport leg between disciplines.
      enum: [running, trail_running, cycling, pool_swimming, open_water_swimming, hiking, strength, transition, other]
    ActivitySummary:
      type: object
      required: [id, sport, subtype, source, startTime, utcOffsetS]
      properties:
        id:
          type: integer
          format: int64
        sport:
          $ref: "#/components/schemas/ActivitySport"
        subtype:
          type: string
          enum: [outdoor, indoor, virtual, treadmill]
        source:
          type: string
          enum: [garmin, upload, manual]
        startTime:
          type: string
          format: date-time
          description: Start in UTC.
        utcOffsetS:
          type: integer
          description: Local offset where the activity happened, in seconds.
        elapsedTimeS:
          type: number
          format: double
        timerTimeS:
          type: number
          format: double
        distanceM:
          type: number
          format: double
        ascentM:
          type: number
          format: float
        avgSpeedMS:
          type: number
          format: float
        avgHrBpm:
          type: integer
        avgPowerW:
          type: integer
        rpe:
          type: number
          format: float
    ActivityPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ActivitySummary"
    ManualActivityRequest:
      type: object
      required: [sport, localStartTime, durationS]
      properties:
        sport:
          $ref: "#/components/schemas/Sport"
        localStartTime:
          type: string
          description: Start in the user's timezone, as YYYY-MM-DDTHH:MM.
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$"
          example: 2026-10-29T07:30
        durationS:
          type: number
          format: double
          description: Duration in seconds, up to 7 days.
          exclusiveMinimum: true
          minimum: 0
          maximum: 604800
        distanceM:
          type: number
          format: double
          description: Distance in metres.
          minimum: 0
          maximum: 10000000
        rpe:
          type: number
          format: double
          description: Rating of perceived exertion, 0 to 10.
          minimum: 0
          maximum: 10
        notes:
          type: string
          maxLength: 2000
    CreatedActivity:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
    UploadResult:
      type: object
      required: [activityIds]
      properties:
        activityIds:
          type: array
          description: The stored activities; several for a multisport file.
          items:
            type: integer
            format: int64
    GarminConnection:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean
        status:
          type: string
          enum: [connected, key_rejected]
          description: key_rejected when Garmin refused the key; sync is paused until a new key is set.
        keyExpiresOn:
          type: string
          format: date
          description: The key's expiry date as entered by the user.
        syncIntervalHours:
          type: integer
          minimum: 1
          maximum: 24
        lastSyncAt:
          type: string
          format: date-time
        syncedThrough:
          type: string
          format: date
          description: The last local day fully synced.
        lastError:
          type: string
          description: Why the last sync failed; absent once a sync succeeds.
    SetGarminKeyRequest:
      type: object
      required: [key, expiresOn]
      properties:
        key:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        expiresOn:
          type: string
          format: date
          description: The expiry Garmin showed when the key was created, at most a year ahead.
    SetGarminSyncIntervalRequest:
      type: object
      required: [hours]
      properties:
        hours:
          type: integer
          minimum: 1
          maximum: 24
    SyncQueued:
      type: object
      required: [queued]
      properties:
        queued:
          type: boolean
          description: False when a sync was already queued or running.
    StartGarminBackfillRequest:
      type: object
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 365
          default: 120
          description: How many days of history to import, ending today.
    ResumeGarminBackfillRequest:
      type: object
      properties:
        retryFailed:
          type: boolean
          default: false
    GarminBackfill:
      type: object
      required: [started]
      properties:
        started:
          type: boolean
        status:
          type: string
          enum: [running, paused, done]
        pauseReason:
          type: string
          enum: [rate_limited, key_rejected, disconnected]
          description: Set while paused. A rate-limited backfill continues by itself.
        windowStart:
          type: string
          format: date
        windowEnd:
          type: string
          format: date
        activitiesTotal:
          type: integer
          description: Activities found in the window; 0 until they are listed.
        activitiesDone:
          type: integer
        activitiesFailed:
          type: integer
        daysTotal:
          type: integer
        daysDone:
          type: integer
          description: Days whose health metrics are stored.
    GarminImportFailure:
      type: object
      required: [sourceActivityId, startTime, reason]
      properties:
        sourceActivityId:
          type: string
        startTime:
          type: string
          format: date-time
        reason:
          type: string
    GarminImportFailurePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/GarminImportFailure"
    ActivityDetail:
      allOf:
        - $ref: "#/components/schemas/ActivitySummary"
        - type: object
          required: [legs]
          properties:
            descentM:
              type: number
              format: float
            maxSpeedMS:
              type: number
              format: float
            maxHrBpm:
              type: integer
            maxPowerW:
              type: integer
            avgCadence:
              type: number
              format: float
            maxCadence:
              type: number
              format: float
            avgTemperatureC:
              type: number
              format: float
            poolLengthM:
              type: number
              format: float
            caloriesKcal:
              type: integer
            feel:
              type: integer
              description: Workout feel, 0 to 100.
            notes:
              type: string
            weatherTemperatureC:
              type: number
              format: float
            weatherCondition:
              type: string
              enum: [sun, cloud, rain, wind, snow]
            workout:
              $ref: "#/components/schemas/RecordedWorkout"
            legs:
              type: array
              description: Every leg of the multisport activity this one belongs to, in order; empty otherwise.
              items:
                $ref: "#/components/schemas/ActivitySummary"

    RecordedWorkout:
      type: object
      required: [steps]
      properties:
        name:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutStep"
    WorkoutStep:
      type: object
      required: [index, durationType]
      description: Values in SI units; duration is s for time, m for distance, a count for reps.
      properties:
        index:
          type: integer
        name:
          type: string
        intensity:
          type: string
        durationType:
          type: string
        duration:
          type: number
          format: double
        targetType:
          type: string
        targetLow:
          type: number
          format: double
        targetHigh:
          type: number
          format: double
        targetZone:
          type: integer
        repeatFrom:
          type: integer
        repeatCount:
          type: integer
        exerciseCategory:
          type: integer
        exerciseNumber:
          type: integer
        weightKg:
          type: number
          format: double
    Lap:
      type: object
      required: [index, startTime]
      properties:
        index:
          type: integer
        startTime:
          type: string
          format: date-time
        elapsedTimeS:
          type: number
          format: double
        timerTimeS:
          type: number
          format: double
        distanceM:
          type: number
          format: double
        ascentM:
          type: number
          format: float
        descentM:
          type: number
          format: float
        avgSpeedMS:
          type: number
          format: float
        maxSpeedMS:
          type: number
          format: float
        avgHrBpm:
          type: integer
        maxHrBpm:
          type: integer
        avgPowerW:
          type: integer
        maxPowerW:
          type: integer
        avgCadence:
          type: number
          format: float
        intensity:
          type: string
          enum: [active, rest, warmup, cooldown, recovery, interval, other]
        workoutStepIndex:
          type: integer
    SwimLength:
      type: object
      required: [index, startTime, active]
      properties:
        index:
          type: integer
        startTime:
          type: string
          format: date-time
        elapsedTimeS:
          type: number
          format: double
        timerTimeS:
          type: number
          format: double
        active:
          type: boolean
          description: False for rest (idle) lengths.
        stroke:
          type: string
          enum: [freestyle, backstroke, breaststroke, butterfly, drill, mixed, im]
        strokes:
          type: integer
        avgSpeedMS:
          type: number
          format: float
        swolf:
          type: number
          format: double
          description: Length time in seconds plus strokes, computed by KudOS.
    StrengthSet:
      type: object
      required: [index, startTime, active]
      properties:
        index:
          type: integer
        startTime:
          type: string
          format: date-time
        durationS:
          type: number
          format: double
        active:
          type: boolean
          description: False for rest sets.
        reps:
          type: integer
        weightKg:
          type: number
          format: float
        exerciseName:
          type: string
        exerciseCategory:
          type: integer
        exerciseNumber:
          type: integer
        workoutStepIndex:
          type: integer
    LapPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Lap"
    SwimLengthPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SwimLength"
    StrengthSetPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/StrengthSet"
    ActivityStreams:
      type: object
      required: [timeS]
      properties:
        timeS:
          type: array
          description: Seconds from the activity start.
          items:
            type: number
            format: double
        lat:
          type: array
          description: Degrees.
          items:
            type: number
            format: double
            nullable: true
        lon:
          type: array
          description: Degrees.
          items:
            type: number
            format: double
            nullable: true
        altitudeM:
          type: array
          description: Metres.
          items:
            type: number
            format: double
            nullable: true
        hrBpm:
          type: array
          description: Beats per minute.
          items:
            type: number
            format: double
            nullable: true
        powerW:
          type: array
          description: Watts.
          items:
            type: number
            format: double
            nullable: true
        cadence:
          type: array
          description: Steps per minute for running and hiking, rpm for cycling.
          items:
            type: number
            format: double
            nullable: true
        speedMS:
          type: array
          description: Metres per second.
          items:
            type: number
            format: double
            nullable: true
        distanceM:
          type: array
          description: Metres from the start.
          items:
            type: number
            format: double
            nullable: true
        temperatureC:
          type: array
          description: Degrees Celsius.
          items:
            type: number
            format: double
            nullable: true
        nextCursor:
          type: string
          description: Cursor for the next page of full-resolution samples; absent on the last page.
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Stable URI identifying the error kind, e.g. urn:kudos:problem:not-found.
        title:
          type: string
          description: Short summary of the error kind.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation of this occurrence.
        requestId:
          type: string
          description: ID of the request, also sent as the X-Request-Id header.
    Page:
      type: object
      description: Pagination envelope. List responses add an `items` array with allOf.
      properties:
        nextCursor:
          type: string
          description: Cursor for the next page; absent on the last page.
  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
